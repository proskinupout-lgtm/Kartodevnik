<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartoДневник | Лицей №6 (6-Е)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #7b2cbf;
            --accent-neon: #00f5d4;
            --accent-yellow: #ffee32;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px 12px; background-image: radial-gradient(circle at 50% 0%, #1a0033 0%, var(--bg-color) 75%); }

        .container { max-width: 550px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-title { font-size: 1.7rem; font-weight: 800; background: linear-gradient(45deg, var(--accent-neon), #9d4edd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-logo { font-size: 0.8rem; color: #888; font-weight: 500; margin-top: 2px; }

        .secret-admin-btn {
            background: none; border: none; color: #ffffff; opacity: 0.25; font-size: 1.2rem; cursor: pointer; transition: 0.3s; padding: 6px; border-radius: 8px;
        }
        .secret-admin-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        .notice-box {
            background: rgba(123, 44, 191, 0.12); border: 1px solid rgba(123, 44, 191, 0.3); border-radius: 16px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.4; color: #e0e0e0; display: flex; align-items: center; gap: 12px;
        }
        .notice-box strong { color: var(--accent-yellow); }
        .tg-link { color: var(--accent-neon); font-weight: 700; text-decoration: none; }

        .glass-box { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .section-title { font-size: 1.05rem; color: var(--accent-yellow); margin-bottom: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .class-grid { display: flex; justify-content: center; }
        .class-btn { background: var(--accent-purple); border: 1px solid var(--accent-neon); color: #fff; padding: 14px 40px; border-radius: 16px; font-weight: 800; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 20px rgba(123, 44, 191, 0.6); text-align: center; }

        .date-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid var(--card-border); border-radius: 16px; padding: 8px 12px; }
        .date-arrow { background: var(--accent-purple); border: none; color: white; width: 36px; height: 36px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .date-arrow:active { transform: scale(0.92); }
        .date-display { font-weight: 700; font-size: 1.05rem; color: var(--accent-neon); }

        .accordion-item { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: 0.3s; }
        .accordion-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; font-size: 0.95rem; }
        .accordion-header:hover { background: rgba(255,255,255,0.04); }
        .accordion-arrow { font-size: 0.75rem; transition: transform 0.3s; color: var(--accent-neon); }
        
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease; padding: 0 16px; background: rgba(0, 0, 0, 0.2); }
        .accordion-item.open .accordion-content { max-height: 500px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.05); }
        .accordion-item.open .accordion-arrow { transform: rotate(180deg); }

        .hw-text { font-size: 0.92rem; line-height: 1.5; color: #ddd; white-space: pre-wrap; font-weight: 500; }
        .empty-msg { color: #777; text-align: center; padding: 25px; font-size: 0.9rem; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 999;
            justify-content: center; align-items: center; padding: 15px;
        }
        .modal-box {
            background: #130f26; border: 1px solid var(--accent-purple); border-radius: 20px;
            padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 0 35px rgba(123, 44, 191, 0.4);
            position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close-btn { position: absolute; top: 16px; right: 20px; color: #888; font-size: 1.5rem; cursor: pointer; }
        
        label { font-size: 0.85rem; color: #aaa; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; margin: 6px 0 14px; border-radius: 12px; background: #1a162b; border: 1px solid #332d4a; color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none; }
        
        .btn-main { width: 100%; padding: 12px; background: var(--accent-purple); border: none; color: #fff; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.95rem; margin-bottom: 8px; }
        .btn-main:hover { background: #9d4edd; }
        .status-text { text-align: center; font-size: 0.85rem; margin: 8px 0; font-weight: 700; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <div class="logo-title">KartoДневник</div>
            <div class="sub-logo">Лицей №6 • Старший корпус</div>
        </div>
        <button class="secret-admin-btn" onclick="openAdmin()" title="Вход">⚙️</button>
    </header>

    <div class="notice-box">
        <span style="font-size: 1.2rem;">📢</span>
        <div>
            <strong>Внимание!</strong> Нужна помощь по домашке — пиши в ТГ: <a href="https://t.me/Bulbakarto" target="_blank" class="tg-link">@Bulbakarto</a>
        </div>
    </div>

    <div class="glass-box">
        <div class="section-title">🏫 Твой класс:</div>
        <div class="class-grid">
            <div class="class-btn">6-Е</div>
        </div>
    </div>

    <div class="glass-box">
        <div class="section-title">📅 Дата:</div>
        <div class="date-bar">
            <button class="date-arrow" onclick="changeDate(-1)">◄</button>
            <div class="date-display" id="dateDisplay">16.09.2024</div>
            <button class="date-arrow" onclick="changeDate(1)">►</button>
        </div>
    </div>

    <div class="glass-box">
        <div class="section-title">📚 Предметы (6-Е):</div>
        <div id="accordionList"></div>
    </div>
</div>

<div class="modal" id="adminModal">
    <div class="modal-box">
        <span class="close-btn" onclick="closeAdmin()">&times;</span>
        
        <div id="authStep">
            <h3 style="color: var(--accent-neon); text-align: center; margin-bottom: 15px;">🔐 Вход в Админку</h3>
            <input type="password" id="passInput" placeholder="Введите пароль">
            <button class="btn-main" onclick="checkPass()">Войти</button>
        </div>

        <div id="adminStep" style="display: none;">
            <h3 style="color: var(--accent-yellow); text-align: center; margin-bottom: 15px;">⚙️ Панель Управления (6-Е)</h3>
            
            <label>Класс:</label>
            <select id="classSelect">
                <option value="6-Е">6-Е</option>
            </select>

            <label>Дата:</label>
            <input type="date" id="dateInput">

            <label>Предмет:</label>
            <input type="text" id="subjectInput" placeholder="Например: Математика">

            <label>Домашнее задание:</label>
            <textarea id="textInput" rows="3" placeholder="Стр 45, № 12, 14"></textarea>

            <button class="btn-main" onclick="publishHW()">🚀 Опубликовать в 1 клик</button>
            <div id="statusText" class="status-text"></div>
        </div>
    </div>
</div>

<script>
    const GH_USER = "proskinupout-lgtm";
    const GH_REPO = "Kartodevnik";
    const ENC_TOKEN = [23, 7, 65, 102, 36, 47, 67, 28, 5, 108, 26, 11, 88, 13, 34, 57, 65, 9, 69, 113, 40, 4, 118, 85, 16, 40, 99, 12, 32, 96, 66, 9, 91, 93, 71, 84, 7, 89, 60, 91];
    let decryptedToken = "";

    let currentDate = new Date();
    let selectedClass = "6-Е";
    
    let localDB = {
        classes: ["6-Е"],
        homework: {}
    };

    async function loadData() {
        try {
            let res = await fetch('homework.json?v=' + Date.now());
            if (res.ok) {
                let data = await res.json();
                if (data && data.classes) {
                    localDB = data;
                }
            }
        } catch(e) {}
        updateDateDisplay();
        loadHomework();
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        updateDateDisplay();
        loadHomework();
    }

    function formatDateKey(date) {
        let d = date.getDate().toString().padStart(2, '0');
        let m = (date.getMonth() + 1).toString().padStart(2, '0');
        let y = date.getFullYear();
        return `${d}.${m}.${y}`;
    }

    function updateDateDisplay() {
        document.getElementById('dateDisplay').innerText = formatDateKey(currentDate);
    }

    function loadHomework() {
        const dateKey = formatDateKey(currentDate);
        const list = document.getElementById('accordionList');
        list.innerHTML = "";

        const tasks = (localDB.homework && localDB.homework["6-Е"] && localDB.homework["6-Е"][dateKey]) || [];

        if (tasks.length === 0) {
            list.innerHTML = `<div class="empty-msg">На ${dateKey} нет домашних заданий 🎉</div>`;
            return;
        }

        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = 'accordion-item';
            item.innerHTML = `
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>📖 ${task.subject}</span>
                    <span class="accordion-arrow">▼</span>
                </div>
                <div class="accordion-content">
                    <div class="hw-text">${task.text}</div>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function toggleAccordion(header) {
        header.parentElement.classList.toggle('open');
    }

    function openAdmin() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

    function checkPass() {
        const pass = document.getElementById('passInput').value;
        if(pass === "po19sa0hp9") {
            decryptedToken = ENC_TOKEN.map((code, i) => String.fromCharCode(code ^ pass.charCodeAt(i % pass.length))).join('');
            document.getElementById('authStep').style.display = 'none';
            document.getElementById('adminStep').style.display = 'block';
            document.getElementById('dateInput').valueAsDate = new Date();
        } else {
            alert("Неверный пароль!");
        }
    }

    async function pushToGitHub() {
        const statusDiv = document.getElementById('statusText');
        statusDiv.style.color = "#ffee32";
        statusDiv.innerText = "⏳ Публикация на GitHub...";

        try {
            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/homework.json`;
            let getRes = await fetch(url, {
                headers: { 'Authorization': `token ${decryptedToken}` }
            });

            let sha = "";
            if (getRes.ok) {
                let fileData = await getRes.json();
                sha = fileData.sha;
            }

            const jsonStr = JSON.stringify(localDB, null, 2);
            const contentEncoded = btoa(unescape(encodeURIComponent(jsonStr)));

            let putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${decryptedToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Обновление Д/З (6-Е)',
                    content: contentEncoded,
                    sha: sha
                })
            });

            if (putRes.ok) {
                statusDiv.style.color = "#00f5d4";
                statusDiv.innerText = "✅ ОПУБЛИКОВАНО ДЛЯ 6-Е!";
                setTimeout(() => statusDiv.innerText = "", 4000);
            } else {
                let errData = await putRes.json();
                statusDiv.style.color = "#ff4d4d";
                statusDiv.innerText = `❌ Ошибка: ${errData.message || putRes.status}`;
            }
        } catch(e) {
            statusDiv.style.color = "#ff4d4d";
            statusDiv.innerText = `❌ Ошибка сети: ${e.message}`;
        }
    }

    async function publishHW() {
        const rawDate = document.getElementById('dateInput').value;
        const dateKey = parseDateToKey(rawDate);
        const subject = document.getElementById('subjectInput').value.trim();
        const text = document.getElementById('textInput').value.trim();

        if(!dateKey || !subject || !text) {
            alert("Заполните все поля!");
            return;
        }

        if(!localDB.homework) localDB.homework = {};
        if(!localDB.homework["6-Е"]) localDB.homework["6-Е"] = {};
        if(!localDB.homework["6-Е"][dateKey]) localDB.homework["6-Е"][dateKey] = [];

        localDB.homework["6-Е"][dateKey].push({
            subject: subject,
            text: text
        });

        await pushToGitHub();
        loadHomework();

        document.getElementById('subjectInput').value = "";
        document.getElementById('textInput').value = "";
    }

    function parseDateToKey(rawDate) {
        if(!rawDate) return "";
        let parts = rawDate.split('-');
        if(parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
        return rawDate;
    }

    loadData();
</script>
</body>
</html>
