<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KartoДневник | Лицей №6</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #7b2cbf;
            --accent-neon: #00f5d4;
            --accent-yellow: #ffee32;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px 10px; background-image: radial-gradient(circle at 50% 0%, #1a0033 0%, var(--bg-color) 75%); }

        .container { max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo-title { font-size: 1.8rem; font-weight: 800; background: linear-gradient(45deg, var(--accent-neon), #9d4edd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-logo { font-size: 0.8rem; color: #888; margin-top: 2px; }

        .secret-admin-btn {
            background: none; border: none; color: #ffffff; opacity: 0.15; font-size: 1.2rem; cursor: pointer; transition: opacity 0.3s; text-decoration: none; padding: 5px;
        }
        .secret-admin-btn:hover { opacity: 1; }

        .notice-box {
            background: rgba(123, 44, 191, 0.15); border: 1px solid var(--accent-purple); border-radius: 16px; padding: 12px 15px; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.4; color: #e0e0e0; display: flex; align-items: center; gap: 10px;
        }
        .notice-box strong { color: var(--accent-yellow); }
        .tg-link { color: var(--accent-neon); font-weight: 700; text-decoration: none; }

        .glass-box { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: 20px; padding: 18px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .section-title { font-size: 1.1rem; color: var(--accent-yellow); margin-bottom: 15px; font-weight: 700; }

        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; }
        .class-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); color: #fff; padding: 12px 5px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; text-align: center; }
        .class-btn:hover, .class-btn.active { background: var(--accent-purple); border-color: var(--accent-neon); transform: scale(1.05); box-shadow: 0 0 15px rgba(123, 44, 191, 0.6); }

        .date-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 15px; padding: 10px 15px; }
        .date-arrow { background: var(--accent-purple); border: none; color: white; width: 38px; height: 38px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .date-arrow:active { transform: scale(0.9); }
        .date-display { font-weight: 700; font-size: 1.1rem; color: var(--accent-neon); }

        .accordion-item { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: 0.3s; }
        .accordion-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; font-size: 1rem; }
        .accordion-header:hover { background: rgba(255,255,255,0.05); }
        .accordion-arrow { font-size: 0.8rem; transition: transform 0.3s; color: var(--accent-neon); }
        
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease; padding: 0 15px; background: rgba(0, 0, 0, 0.2); }
        .accordion-item.open .accordion-content { max-height: 500px; padding: 15px; }
        .accordion-item.open .accordion-arrow { transform: rotate(180deg); }

        .hw-text { font-size: 0.95rem; line-height: 1.5; color: #ddd; white-space: pre-wrap; }
        .empty-msg { color: #777; text-align: center; padding: 20px; font-size: 0.95rem; }
        .loading { text-align: center; color: var(--accent-neon); padding: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <div class="logo-title">KartoДневник</div>
            <div class="sub-logo">Лицей №6 • Старший корпус</div>
        </div>
        <a href="admin.html" class="secret-admin-btn" title="Вход">⚙️</a>
    </header>

    <div class="notice-box">
        <span>📢</span>
        <div>
            <strong>Внимание!</strong> Если твоего класса нет или хочешь отправить домашку — пиши в ТГ: <a href="https://t.me/Bulbakarto" target="_blank" class="tg-link">@Bulbakarto</a>
        </div>
    </div>

    <div class="glass-box">
        <div class="section-title">🏫 Выбери класс:</div>
        <div class="class-grid" id="classGrid">
            <div class="loading">Загрузка данных...</div>
        </div>
    </div>

    <div class="glass-box" id="dateSection" style="display: none;">
        <div class="section-title">📅 Дата:</div>
        <div class="date-bar">
            <button class="date-arrow" onclick="changeDate(-1)">◄</button>
            <div class="date-display" id="dateDisplay">16.09.2024</div>
            <button class="date-arrow" onclick="changeDate(1)">►</button>
        </div>
    </div>

    <div class="glass-box" id="hwSection" style="display: none;">
        <div class="section-title" id="hwTitle">📚 Предметы:</div>
        <div id="accordionList"></div>
    </div>
</div>

<script>
    const CLOUD_URL = "https://kartodnevnls-default-rtdb.firebaseio.com/lyceum6.json";
    let currentDate = new Date();
    let selectedClass = "";
    let localDB = { classes: ["5-А", "6-Е", "7-Б", "8-А", "9-В", "10-Б", "11-А"], homework: {} };

    async function syncCloud() {
        try {
            let response = await fetch(CLOUD_URL);
            if (response.ok) {
                let data = await response.json();
                if (data && data.classes) {
                    localDB = data;
                }
            }
        } catch (e) {}
        renderClasses();
        if (selectedClass) loadHomework();
    }

    function renderClasses() {
        const grid = document.getElementById('classGrid');
        grid.innerHTML = "";
        localDB.classes.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'class-btn' + (c === selectedClass ? ' active' : '');
            btn.innerText = c;
            btn.onclick = () => selectClass(c, btn);
            grid.appendChild(btn);
        });
        updateDateDisplay();
    }

    function selectClass(c, btn) {
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedClass = c;
        document.getElementById('dateSection').style.display = 'block';
        document.getElementById('hwSection').style.display = 'block';
        loadHomework();
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        updateDateDisplay();
        loadHomework();
    }

    function formatDateKey(date) {
        let d = date.getDate().toString().padStart(2, '0');
        let m = (date.getMonth() + 1).toString().padStart(2, '0');
        let y = date.getFullYear();
        return `${d}.${m}.${y}`;
    }

    function updateDateDisplay() {
        document.getElementById('dateDisplay').innerText = formatDateKey(currentDate);
    }

    function loadHomework() {
        const dateKey = formatDateKey(currentDate);
        const list = document.getElementById('accordionList');
        list.innerHTML = "";

        const tasks = (localDB.homework && localDB.homework[selectedClass] && localDB.homework[selectedClass][dateKey]) || [];

        if (tasks.length === 0) {
            list.innerHTML = `<div class="empty-msg">На ${dateKey} нет домашних заданий 🎉</div>`;
            return;
        }

        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = 'accordion-item';
            item.innerHTML = `
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>📖 ${task.subject}</span>
                    <span class="accordion-arrow">▼</span>
                </div>
                <div class="accordion-content">
                    <div class="hw-text">${task.text}</div>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function toggleAccordion(header) {
        header.parentElement.classList.toggle('open');
    }

    syncCloud();
    setInterval(syncCloud, 3000);
</script>
</body>
</html>
